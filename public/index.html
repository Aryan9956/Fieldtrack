<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldTrack Mobile</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 24px 0;
      max-width: 280px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Auto-redirect Capacitor fallback WebView to live server or login
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (window.location.protocol === 'file:') {
          // If loaded as local file scheme in Android APK
          window.location.href = 'http://10.0.2.2:3000/login';
        }
      }, 500);
    });
  </script>
</head>
<body>
  <div class="logo-badge">F</div>
  <h1>FieldTrack</h1>
  <p>Connecting to Field Workforce Tracking Server...</p>
  <div class="spinner"></div>
</body>
</html>
