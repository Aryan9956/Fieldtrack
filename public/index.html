<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldTrack Mobile</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 20px 0;
      max-width: 320px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 24px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-retry {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: none;
    }
  </style>
  <script>
    const LIVE_URL = 'https://fieldtrack.netlify.app/login';
    const LOCAL_URL = 'http://10.114.255.57:3000/login';

    function redirectToApp() {
      // Direct to live online Netlify server first
      window.location.href = LIVE_URL;
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Auto-redirect to live Netlify server after 300ms
      setTimeout(redirectToApp, 300);

      // If still on this page after 4 seconds (e.g. offline or connecting), show Retry button
      setTimeout(() => {
        const btn = document.getElementById('retryBtn');
        const status = document.getElementById('statusText');
        if (btn) btn.style.display = 'inline-block';
        if (status) status.innerText = 'Connecting to server took longer than expected. Tap below to connect to live online app:';
      }, 4000);
    });
  </script>
</head>
<body>
  <div class="logo-badge">F</div>
  <h1>FieldTrack</h1>
  <p id="statusText">Connecting to Field Workforce Tracking Server...</p>
  <div class="spinner"></div>
  <button id="retryBtn" class="btn-retry" onclick="redirectToApp()">🚀 Open Live FieldTrack App</button>
</body>
</html>
